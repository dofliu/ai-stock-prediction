[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-prediction"
version = "0.1.0"
description = "AI 股價預測與策略模擬框架：合成市場、特徵工程、walk-forward 驗證、回測與蒙地卡羅模擬"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "JuiHung Liu" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# ruff is upper-bounded because CI runs `ruff format --check`, which a new
# formatter release can fail without any change to this repository.
dev = ["pytest>=7.4", "ruff>=0.15,<0.17"]
plot = ["matplotlib>=3.7"]

[project.scripts]
ai-stock = "ai_stock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B008"]
